<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-label="Tatva Yoga Studio logo">
  <defs>
    <style>
      .bg { fill: #274a44; }
      .light { fill: #cfd7cf; }
      .text { fill: #efeede; font-family: 'Poppins', 'Inter', Arial, sans-serif; }
    </style>
  </defs>
  <!-- circular background -->
  <circle class="bg" cx="250" cy="250" r="240"/>
  <!-- simple lotus motif (stylized) -->
  <g transform="translate(250 220)">
    <path class="light" d="M0 -80 C -20 -40 -40 -10 -60 20 C -20 10 20 10 60 20 C 40 -10 20 -40 0 -80 Z"/>
    <path class="light" d="M0 -110 C -10 -80 -20 -55 -30 -30 C -10 -40 10 -40 30 -30 C 20 -55 10 -80 0 -110 Z"/>
    <path class="light" d="M-85 -10 C -120 10 -140 35 -150 70 C -110 55 -70 40 -35 25 Z"/>
    <path class="light" d="M85 -10 C 120 10 140 35 150 70 C 110 55 70 40 35 25 Z"/>
  </g>
  <!-- brand text -->
  <text class="text" x="250" y="320" font-size="84" font-weight="700" text-anchor="middle" letter-spacing="6">TATVA</text>
  <text class="text" x="250" y="365" font-size="28" font-weight="500" text-anchor="middle" opacity="0.85">Yoga Studio</text>
</svg>
